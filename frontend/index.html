<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pulse.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Pulse - Real-Time Market Monitoring Engine</title>
    <meta name="title" content="Pulse - Real-Time Market Monitoring Engine" />
    <meta
      name="description"
      content="Monitor cryptocurrency and stock markets in real-time with Pulse - your comprehensive market monitoring platform with alerts, portfolio tracking, and live news updates."
    />
    <meta
      name="keywords"
      content="crypto, cryptocurrency, stocks, market monitoring, portfolio tracker, trading, market alerts, real-time data, bitcoin, ethereum, financial markets"
    />
    <meta name="author" content="Pulse Platform" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pulse-platform.com/" />
    <meta
      property="og:title"
      content="Pulse - Real-Time Market Monitoring Engine"
    />
    <meta
      property="og:description"
      content="Monitor cryptocurrency and stock markets in real-time with comprehensive alerts, portfolio tracking, and live news updates."
    />
    <meta property="og:site_name" content="Pulse" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Pulse - Real-Time Market Monitoring Engine"
    />
    <meta
      name="twitter:description"
      content="Real-time cryptocurrency and stock market monitoring platform with alerts and portfolio tracking."
    />

    <!-- Theme Color for mobile browsers -->
    <meta name="theme-color" content="#3b82f6" />
    <meta name="msapplication-TileColor" content="#3b82f6" />

    <!-- Performance optimization -->
    <link rel="preconnect" href="http://localhost:8000" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
